plugins {
    id 'java'
    id 'groovy'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '11.14.1'
}

group = 'com.refridge'
version = '0.0.1-SNAPSHOT'
description = 'fridge_management'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly { extendsFrom annotationProcessor }
    querydsl {
        extendsFrom compileClasspath
        exclude group: 'org.springframework.ai'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spring.io/milestone' }
}

ext {
    queryDslVersion       = '5.1.0'
    spockVersion          = '2.4-groovy-4.0'
    testcontainersVersion = '1.20.4'
    springAiVersion       = '2.0.0-M4'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

flyway {
    url      = 'jdbc:postgresql://localhost:5433/fridge_db'
    user     = 'fridge_user'
    password = 'fridge_secret'
    schemas  = ['fridge_schema']
    locations = ['classpath:db/migration']
}

dependencies {
    // ── Spring Boot Starters ──────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ── DB: PostgreSQL ────────────────────────────────────────────────
    runtimeOnly 'org.postgresql:postgresql'

    // ── Flyway ───────────────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // ── Spring AI 2.0.0-M4 ───────────────────────────────────────────
    // gemma4:e4b(채팅) + bge-m3(임베딩) — 로컬 Ollama
    // 운영 전환 시: spring-ai-starter-model-openai 추가 후 application.yml provider 변경
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'

    // ── Lombok ───────────────────────────────────────────────────────
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    // ── QueryDSL 5.1.0 (jakarta) ─────────────────────────────────────
    implementation "com.querydsl:querydsl-jpa:${queryDslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${queryDslVersion}:jakarta"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    // ── Redis Streams ─────────────────────────────────────────────────
    implementation 'io.lettuce:lettuce-core'

    // ── Micrometer / Prometheus ───────────────────────────────────────
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // ── Dev Tools ────────────────────────────────────────────────────
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    // ── Test ─────────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:jdbc:${testcontainersVersion}"

    testImplementation "org.spockframework:spock-core:${spockVersion}"
    testImplementation "org.spockframework:spock-spring:${spockVersion}"
    testImplementation 'org.apache.groovy:groovy-all:4.0.22'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
    main { java.srcDirs += querydslDir }
}

tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory = querydslDir
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '-Dspring.profiles.active=test'
}